version: '3'
services:
  app:
    build:
      context: .
      dockerfile: dockerfile
      platforms:
        - "linux/amd64"
      args:
        - BUILDKIT_INLINE_CACHE=1
        - GIT_COMMIT=${GIT_COMMIT:-latest}
    ports:
      - "3001:3000"  # Bind to 0.0.0.0 so host.docker.internal works from nginx-proxy container
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      guide_design:
        condition: service_started
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=db
      - NODE_ENV=production
      # Node derives its heap ceiling from host RAM; on a 2 GB box
      # shared with several other stacks that is far too generous.
      - NODE_OPTIONS=--max-old-space-size=192
      - UV_THREADPOOL_SIZE=2
      - SES_HOST=${SES_HOST}
      - SES_PORT=${SES_PORT}
      - SES_USER=${SES_USER}
      - SES_PASS=${SES_PASS}
      - SES_FROM=${SES_FROM}
    mem_limit: 384m
    restart: unless-stopped

  guide_design:
    build:
      context: ..
      dockerfile: server/services/guide_design/Dockerfile
      platforms:
        - "linux/amd64"
      args:
        - BUILDKIT_INLINE_CACHE=1
        - GIT_COMMIT=${GIT_COMMIT:-latest}
    volumes:
      - ../pt_guide_design:/app/packages/pt_guide_design:ro
      - ../sgrna_scorer:/app/packages/sgrna_scorer:ro
      - ../sgrna_scorer/resources:/app/packages/sgrna_scorer/resources:ro
    environment:
      - PYTHONPATH=/app/packages:${PYTHONPATH}
      - GENOME_PATH=/app/packages/pt_guide_design/resources/Phaeodactylum_tricornutum.ASM15095v2.dna.toplevel.fa
      - MODEL_PATH=/app/packages/sgrna_scorer/resources/model.weights.h5
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "4G"
    restart: unless-stopped

  db:
    image: postgres:16
    platform: linux/amd64
    ports:
      # Loopback-only: nothing off-box needs this, and a published port
      # bypasses ufw (docker writes its DNAT rules ahead of FORWARD).
      # Still reachable through an SSH tunnel, which terminates on the host.
      - "127.0.0.1:5433:5432"  # 5433 to avoid conflict with BuckEuchre postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=20
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=0
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: "redis:latest"
    platform: linux/amd64
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    mem_limit: 128m
    ports:
      # Loopback-only. This Redis has no requirepass, and an exposed Redis is
      # not just a data leak — CONFIG SET dir/dbfilename is a known RCE path.
      # The app reaches it over the compose network as `redis`.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
